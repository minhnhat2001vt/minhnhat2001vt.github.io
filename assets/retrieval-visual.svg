<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img" aria-labelledby="t d">
  <title id="t">Moment retrieval schematic</title>
  <desc id="d">A video timeline is divided into candidate moments, globally reranked, and refined with bidirectional temporal search.</desc>
  <rect width="600" height="420" fill="#fbfaf7"/>
  <text x="48" y="78" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#171a19">VIDEO TIMELINE</text>
  <g transform="translate(48,105)">
    <rect x="0" y="0" width="504" height="42" fill="#ebe6dc" stroke="#cfd1ca"/>
    <rect x="84" y="0" width="85" height="42" fill="#d8e4e1"/>
    <rect x="286" y="0" width="92" height="42" fill="#c8dcd8"/>
    <rect x="420" y="0" width="49" height="42" fill="#d8e4e1"/>
    <g stroke="#cfd1ca">
      <path d="M84 0 V42 M169 0 V42 M252 0 V42 M336 0 V42 M420 0 V42"/>
    </g>
  </g>

  <g font-family="Arial, sans-serif">
    <text x="48" y="202" font-size="11" font-weight="700" fill="#626762">GLOBAL RE-RANKING</text>
    <rect x="48" y="220" width="154" height="52" rx="3" fill="#171a19"/>
    <text x="125" y="241" text-anchor="middle" font-size="11" font-weight="700" fill="#f4f1ea">candidate 02</text>
    <text x="125" y="258" text-anchor="middle" font-size="10" fill="#b8c6c3">highest global score</text>

    <path d="M218 246 H315" stroke="#245c61" stroke-width="2"/>
    <path d="M306 239 L316 246 L306 253" fill="none" stroke="#245c61" stroke-width="2"/>

    <text x="338" y="202" font-size="11" font-weight="700" fill="#626762">TEMPORAL REFINEMENT</text>
    <rect x="338" y="220" width="214" height="52" rx="3" fill="#d8e4e1" stroke="#8aa9a6"/>
    <text x="445" y="241" text-anchor="middle" font-size="11" font-weight="700" fill="#171a19">← search · moment · search →</text>
    <text x="445" y="258" text-anchor="middle" font-size="10" fill="#4d6563">adaptive boundaries</text>
  </g>

  <line x1="48" y1="333" x2="552" y2="333" stroke="#cfd1ca"/>
  <text x="48" y="362" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#245c61">retrieve broadly, then refine locally</text>
</svg>
